<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0a0f1a"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <circle cx="150" cy="100" r="200" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1050" cy="530" r="180" fill="#818cf8" opacity="0.1"/>
  <text x="600" y="240" text-anchor="middle" fill="#38bdf8" font-family="Tahoma, Arial, sans-serif" font-size="28" font-weight="600">وحید رضازاده</text>
  <text x="600" y="300" text-anchor="middle" fill="#e2e8f0" font-family="Tahoma, Arial, sans-serif" font-size="42" font-weight="700">توسعه‌دهنده نرم‌افزار</text>
  <text x="600" y="360" text-anchor="middle" fill="#94a3b8" font-family="Tahoma, Arial, sans-serif" font-size="24">Laravel · Node.js · Next.js · Golang · .NET · Spring Boot</text>
  <rect x="350" y="410" width="500" height="4" rx="2" fill="url(#gradient)"/>
